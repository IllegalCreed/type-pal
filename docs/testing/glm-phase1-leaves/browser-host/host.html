<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>GLM第三对话 LV1-LV4 隔离短视觉宿主</title>
<style>
  body { background: #1a1410; color: #f0e0b0; font: 13px/1.5 ui-monospace, Menlo, monospace; margin: 16px; }
  canvas.screen { width: 640px; height: 400px; image-rendering: pixelated; border: 1px solid #553322; display: block; }
  canvas.small { width: 192px; height: 192px; image-rendering: pixelated; border: 1px solid #553322; }
  section { margin-bottom: 20px; }
  h2 { color: #d8b365; margin: 4px 0; }
  button { background: #2a1515; color: #f0e0b0; border: 1px solid #553322; padding: 2px 10px; margin-right: 6px; cursor: pointer; }
  #log { white-space: pre-wrap; color: #9a8a6a; max-height: 120px; overflow: auto; }
  .row { display: flex; gap: 24px; align-items: flex-start; }
  .status { color: #6fcf97; }
</style>
</head>
<body>
<h1>GLM 第三对话隔离短视觉宿主（生产 draw/setup + 合法 fixture；320×200 原始逻辑画布 2× 整数展示）</h1>

<section id="lv1">
  <h2>LV1/C 菜单绘制（drawMenuStack）</h2>
  <canvas id="lv1-canvas" class="screen" width="320" height="200"></canvas>
  <div>
    <button type="button" data-lv1="0">主菜单 hub</button>
    <button type="button" data-lv1="1">系统菜单 关/开</button>
    <button type="button" data-lv1="2">存档槽 savedTimes</button>
  </div>
</section>

<section id="lv2">
  <h2>LV2/D 战斗 UI 与结算（drawBattleUI / drawBattleSettlement）</h2>
  <canvas id="lv2-canvas" class="screen" width="320" height="200"></canvas>
  <div>
    <button type="button" data-lv2="0">selectMove 主菜单</button>
    <button type="button" data-lv2="1">结算 exp-cash</button>
    <button type="button" data-lv2="2">结算 level-up</button>
    <button type="button" data-lv2="3">结算 learn-magic</button>
  </div>
</section>

<section id="lv3">
  <h2>LV3/E 工具面板 + 小地图（setupToolsPanel / drawMinimap）</h2>
  <div class="row">
    <div id="lv3-panel-host"></div>
    <div>
      <canvas id="lv3-minimap" class="small" width="96" height="96"></canvas>
      <div><button type="button" id="lv3-open">Backquote 唤出面板</button> <button type="button" id="lv3-click">点小地图（记录回调）</button></div>
      <div>点击坐标回调：<span id="lv3-callback" class="status">（未点）</span></div>
    </div>
  </div>
</section>

<section id="lv4">
  <h2>LV4/F 加载进度收尾 + 计时 overlay 显隐（precache-ui / speedrun overlay+countdown）</h2>
  <div class="row">
    <div id="lv4-progress-host"></div>
    <div>
      <div id="lv4-countdown-host" style="min-height:80px"></div>
      <div>overlay：<span id="lv4-overlay-state" class="status">隐藏</span></div>
      <div><button type="button" id="lv4-overlay-show">显示计时 overlay</button><button type="button" id="lv4-overlay-hide">隐藏</button></div>
    </div>
  </div>
</section>

<div id="log"></div>
<script type="module" src="/docs/testing/glm-phase1-leaves/browser-host/main.mjs"></script>
</body>
</html>
