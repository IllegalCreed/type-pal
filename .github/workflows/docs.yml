name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documentation-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        stage: [tools-1, tools-2, tools-3, navigation, model, review, progress, lint]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned pnpm without a bootstrap version switch
        run: |
          npm install --prefix "$RUNNER_TEMP/type-pal-pnpm" pnpm@10.29.2
          echo "$RUNNER_TEMP/type-pal-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.2
          cache: pnpm
          # The bootstrap determines the store location as well as its version.
          cache-dependency-path: |
            pnpm-lock.yaml
            .github/workflows/*.yml
      - run: pnpm install --frozen-lockfile
      - name: Restore the pinned retained evidence and run the complete assigned gates
        run: python3 -B scripts/docs/restore-e2e-evidence.py --ci-stage "${{ matrix.stage }}"
        env:
          GH_TOKEN: ${{ github.token }}

  documentation:
    if: ${{ always() }}
    needs: [documentation-gates]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every documentation stage to succeed
        env:
          GATES_RESULT: ${{ needs['documentation-gates'].result }}
        run: |
          if [ "$GATES_RESULT" != "success" ]; then
            printf '%s\n' "Documentation stage failed, skipped or cancelled: $GATES_RESULT" >&2
            exit 1
          fi
