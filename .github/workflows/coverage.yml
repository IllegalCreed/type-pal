name: Coverage ratchet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check types and lint before coverage
        run: pnpm typecheck && pnpm lint
      - name: Check coverage against the protected base branch
        if: github.event_name == 'pull_request'
        run: pnpm coverage:fast
        env:
          TYPE_PAL_COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Check coverage on a direct main push
        if: github.event_name == 'push'
        run: pnpm coverage:fast
        env:
          TYPE_PAL_COVERAGE_BASE_REF: ${{ github.event.before }}
      - name: Check coverage manually
        if: github.event_name == 'workflow_dispatch'
        run: pnpm coverage:fast
      - name: Upload per-package reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-fast-${{ github.sha }}
          path: coverage/fast
          if-no-files-found: ignore
          retention-days: 7
