name: Coverage ratchet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TYPE_PAL_COVERAGE_PARALLEL_EDITOR: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.29.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check types and lint before coverage
        run: pnpm test:quality-tools && pnpm typecheck && pnpm lint
      - name: Check coverage against the protected base branch
        if: github.event_name == 'pull_request'
        run: pnpm coverage:fast
        env:
          TYPE_PAL_COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Check coverage on a direct main push
        if: github.event_name == 'push'
        run: pnpm coverage:fast
        env:
          TYPE_PAL_COVERAGE_BASE_REF: ${{ github.event.before }}
      - name: Check coverage manually
        if: github.event_name == 'workflow_dispatch'
        run: pnpm coverage:fast
      - name: Upload per-package reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fast-${{ github.sha }}
          path: coverage/fast
          if-no-files-found: ignore
          retention-days: 7
