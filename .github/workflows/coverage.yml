name: Coverage ratchet

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-coverage:
    runs-on: ubuntu-24.04
    # Serialize package collection on this runner; individual test deadlines stay fixed.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install the pinned pnpm without a bootstrap version switch
        run: |
          npm install --prefix "$RUNNER_TEMP/type-pal-pnpm" pnpm@10.29.2
          echo "$RUNNER_TEMP/type-pal-pnpm/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          # The bootstrap determines the store location as well as its version.
          cache-dependency-path: |
            pnpm-lock.yaml
            .github/workflows/*.yml
      - run: pnpm install --frozen-lockfile
      - name: Check types and lint before coverage
        run: pnpm test:quality-tools && pnpm typecheck && pnpm lint
      - name: Check coverage against the protected base branch
        if: github.event_name == 'pull_request'
        run: pnpm coverage:fast
        env:
          TYPE_PAL_COVERAGE_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - name: Check coverage on a direct main push
        if: github.event_name == 'push'
        run: pnpm coverage:fast
        env:
          TYPE_PAL_COVERAGE_BASE_REF: ${{ github.event.before }}
      - name: Check coverage manually
        if: github.event_name == 'workflow_dispatch'
        run: pnpm coverage:fast
      - name: Upload per-package reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fast-${{ github.sha }}
          path: coverage/fast
          if-no-files-found: ignore
          retention-days: 7
