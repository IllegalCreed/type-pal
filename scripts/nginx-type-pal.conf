# type-pal — 仙剑奇侠传浏览器复刻(静态站)nginx 配置
# 部署位置:服务器 /etc/nginx/conf.d/type-pal.conf(本文件与线上保持一致,可追溯)
# 改完务必:nginx -t && systemctl reload nginx
#
# 缓存策略(已核对构建产物 + Service Worker 逻辑):
#   /                              SPA 入口/导航   → no-cache(部署即时生效,根治"要硬刷")
#   /sw.js                         Service Worker  → no-cache(CDN 也不缓存旧 worker)
#   /assets/*                      hash 指纹产物    → immutable 1 年
#   /extracted/asset-manifest.json SW 版本信号源    → no-cache(否则重出资源后 SW 不刷新)
#   /extracted/*                   游戏资源(重提取才变) → 7 天
#   soundfont.sf3 / spessasynth_*  无 hash 但极少变  → 30 天
# 接入 CDN 后:gzip_proxied/vary 让 CDN 正确处理压缩;Brotli 在 CDN 控制台开(本机无 brotli 模块)。
server {
    server_name pal.illegalscreed.cn;

    root /var/www/type-pal/dist;

    # 游戏冷启动一次发 ~3200 个请求;默认 keepalive_requests 1000 令一条 HTTP/2 连接服务满
    # 1000 请求即发 GOAWAY 断连,在途请求概率性 net::ERR_FAILED(2026-06-13 读档 tile 加载失败)。
    keepalive_requests 100000;
    index index.html;

    # SPA 入口/导航:no-cache。访问 "/" 经 try_files fallback 到 index.html,
    # 匹配的是本 location(而非 =/index.html),故 no-cache 必须加在这里才对 "/" 生效。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Service Worker:no-cache,改 sw.js 即时生效(CDN 也不缓存旧 worker)
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    # vite 构建产物带 hash,永久缓存
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SW 的版本信号源:必须 no-cache,否则重出资源后 SW 读到旧 version,
    # 不换 CACHE_NAME / 不重新预缓存 → 老用户永远卡在旧资源。
    location = /extracted/asset-manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # 游戏资源树(rsync 增量更新,etag 兜底;重提取后 7 天内可能吃缓存,可手动 Shift 刷新)
    location /extracted/ {
        expires 7d;
    }

    # 无 hash 但极少变的壳大文件
    location = /soundfont.sf3 {
        expires 30d;
    }
    location = /spessasynth_processor.min.js {
        expires 30d;
    }

    # 文本压缩(JSON 实测 level 6 压到 ~9%)。proxied any/vary on 为接入 CDN 准备:
    #   proxied any → 经 CDN 回源(带 Via 头)也压;vary on → CDN 按 Accept-Encoding 分缓存。
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/wasm;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pal.illegalscreed.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pal.illegalscreed.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = pal.illegalscreed.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name pal.illegalscreed.cn;
    return 404; # managed by Certbot


}
