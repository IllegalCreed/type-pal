<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <title>reforge</title>
    <style>
      body { margin: 0; background: #111; display: grid; place-items: center; min-height: 100vh; }
      /* 物理 1280×800(逻辑 320×200 的 4x);窗口变窄时等比缩小，绝不裁剪主菜单/场景。 */
      canvas {
        image-rendering: pixelated;
        display: block;
        width: min(1280px, 100vw);
        height: auto;
        max-height: 100vh;
        aspect-ratio: 8 / 5;
      }
    </style>
  </head>
  <body>
    <canvas id="screen" width="1280" height="800"></canvas>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
